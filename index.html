  stage.classList.remove('fade'); void stage.offsetWidth; stage.classList.add('fade');

  const img = new Image();
  img.src = s.img; img.alt = s.name; img.width = s.w; img.height = s.h; img.draggable = false;
  stage.appendChild(img);

  for (const h of s.hs) {
    const a = document.createElement('a');
    a.className = 'hs';
    a.style.left = (h.x / s.w * 100) + '%';
    a.style.top = (h.y / s.h * 100) + '%';
    a.style.width = (h.w / s.w * 100) + '%';
    a.style.height = (h.h / s.h * 100) + '%';
    if (h.to) {
      a.href = '#' + h.to;
      a.setAttribute('aria-label', 'Ir a ' + DATA.screens[h.to].name);
      new Image().src = DATA.screens[h.to].img; // precarga
    } else if (h.scroll != null) {
      a.href = 'javascript:void 0';
      a.setAttribute('aria-label', 'Desplazar');
      a.addEventListener('click', e => { e.preventDefault(); scrollToFrameY(s, h.scroll); });
    }
    stage.appendChild(a);
  }

  if (s.timer) {
    new Image().src = DATA.screens[s.timer.to].img;
    timer = setTimeout(() => go(s.timer.to), s.timer.ms);
  }
  window.scrollTo(0, scrollY || 0);
}

function scrollToFrameY(s, y) {
  const r = stage.getBoundingClientRect();
  window.scrollTo({ top: window.scrollY + r.top + y * (r.width / s.w), behavior: 'smooth' });
}

stage.addEventListener('click', e => { if (!e.target.closest('.hs')) flash(); });
document.getElementById('btn-home').addEventListener('click', () => go(DATA.start));
document.getElementById('btn-hint').addEventListener('click', flash);
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'r' || e.key === 'R') go(DATA.start);
  if (e.key === 'h' || e.key === 'H') flash();
});
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
render(location.hash.slice(1) || DATA.start);
</script>
</body>
</html>
